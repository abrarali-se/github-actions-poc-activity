name: Secrets Demo
on:
  workflow_dispatch:
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Show variable
        run: echo "APP_MODE is ${{ vars.APP_MODE }}"
      - name: Use secret (will be masked)
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: echo "The secret is $MY_SECRET"
      - name: Call API with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }} --jq '{"name": .name, "owner": .owner.login, "private": .private}'
